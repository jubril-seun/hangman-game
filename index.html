<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Hangman Game</title>
</head>
<body>
    <header>
        <h2>Hangm<span class="header-emoji">💀</span>n</h2>
    </header>
    <main>
        <div class="game-board">
            <div class="top-area"></div>
            <div class="bottom-area"></div>
        </div>
    </main>

    <dialog id="gameover-modal">
        <div id="dialog-wrapper">
            <h2 id="modal-message">Would you like to play again?</h2>
            <div class="modal-btns">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>
    </dialog>
</body>
</html>
